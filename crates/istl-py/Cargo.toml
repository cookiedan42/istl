[package]
name = "istl-py"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[lib]
name = "istl"
crate-type = ["cdylib"]

[dependencies]
istl-core = { path = "../istl-core" }
istl-objectstore = { path = "../istl-objectstore", optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
url = { version = "2", optional = true }

[features]
default = ["remote"]
remote = ["dep:istl-objectstore", "dep:url"]
