[package]
name = "istl-objectstore"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
istl-core = { path = "../istl-core" }
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "http"] }
url = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util"] }
futures = "0.3"
bytes = "1"

[dev-dependencies]
async-trait = "0.1"
