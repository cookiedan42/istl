[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "istl"
version = "0.1.0"
requires-python = ">=3.10"
description = "Indexed STL — Hilbert-sorted, bbox-indexed binary STL"
readme = "README.md"

[tool.maturin]
module-name = "istl"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module", "remote"]
